<style>
:root{--navy:#071227;--navy2:#102a55;--blue:#165dff;--cyan:#16b8e8;--green:#0a9f52;--orange:#ff8a00;--red:#b8202b;--bg:#edf3f9;--card:#fff;--ink:#111827;--muted:#667085;--line:#d6dfeb;--soft:#f7f9fc;--bad:#b42318;--shadow:0 10px 26px rgba(7,18,39,.10);--shell:560px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--navy),#102a55 180px,var(--bg) 180px);font-size:16px;padding-bottom:92px}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.shell{width:min(100%,var(--shell));margin:auto}.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--navy),#173a72);color:#fff;padding:10px 12px;border-bottom:4px solid var(--red);box-shadow:0 3px 15px rgba(0,0,0,.18)}.brand{display:flex;align-items:center;gap:10px}.brand img{width:78px;height:44px;object-fit:contain;background:#fff;border-radius:10px}.brand h1{margin:0;font-size:1.04rem}.brand p{margin:2px 0 0;color:#d7e5f8;font-size:.68rem;font-weight:700}.screen{padding:12px}.hidden{display:none!important}.banner{background:#fff7ed;border:1px solid #f2c37d;border-left:5px solid var(--orange);border-radius:14px;padding:9px 10px;margin-bottom:10px;color:#6f3500;font-size:.76rem;font-weight:800}.hero{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px}.hero h2{margin:0;color:var(--navy);font-size:1.35rem}.hero p{margin:4px 0 0;color:var(--muted);font-size:.78rem;font-weight:700}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.kpi{border:1px solid var(--line);background:#fbfcfe;border-radius:15px;padding:10px}.kpi small{display:block;color:var(--muted);font-size:.66rem;font-weight:850}.kpi b{display:block;color:var(--navy);font-size:1.35rem;margin-top:2px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:15px 2px 7px}.section-title h3{margin:0;font-size:.92rem;color:var(--navy)}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:.64rem;font-weight:950;background:#eef4ff;color:#173b6c}.pill.hot{background:#fff0d8;color:#7a3400}.pill.good{background:#eefbf4;color:#065f36}.pill.bad{background:#fff1f1;color:#8a1111}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px;margin-bottom:8px;box-shadow:0 5px 15px rgba(7,18,39,.05)}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.card h4{margin:0;color:var(--navy);font-size:.96rem}.muted{color:var(--muted);font-size:.71rem;font-weight:700}.money-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.money-box{border:1px solid #e5e7eb;border-radius:12px;background:#fbfcfe;padding:7px}.money-box small{display:block;color:var(--muted);font-size:.58rem;font-weight:850}.money-box b{display:block;color:var(--navy);font-size:.8rem;margin-top:2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.btn{min-height:48px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);font-weight:900;padding:8px}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.orange{background:#fff7ed;border-color:#f2c37d;color:#6f3500}.btn.danger{color:var(--bad)}.btn.full{width:100%}.big-add{width:100%;min-height:68px;border:0;border-radius:18px;background:var(--green);color:#fff;font-size:1rem;font-weight:1000;box-shadow:0 9px 22px rgba(10,159,82,.25);margin-top:10px}.route-card{border:2px solid #b7ebcb;background:#f5fff9}.route-card.hot{border-color:#f2c37d;background:#fffaf0}.route-head{display:flex;justify-content:space-between;gap:8px}.route-head strong{font-size:1.05rem;color:var(--navy)}.route-list{margin:8px 0 0;padding:0;list-style:none}.route-list li{padding:6px 0;border-top:1px solid rgba(0,0,0,.07);font-size:.76rem;font-weight:800}.route-build{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:9px}.route-build input{min-height:49px;border:1.5px solid var(--line);border-radius:13px;padding:8px}.empty{background:#fff;border:1px dashed #aab8ca;border-radius:16px;padding:20px;text-align:center;color:var(--muted);font-size:.8rem;font-weight:800}.quick-capture{background:#eefbf4;border:1px solid #b7ebcb;border-radius:18px;padding:11px;margin-bottom:10px}.quick-capture h3{margin:0 0 3px;color:#065f36}.quick-capture p{margin:0 0 8px;color:#397257;font-size:.7rem;font-weight:700}.capture-row{display:grid;grid-template-columns:1fr auto;gap:7px}.capture-row textarea{min-height:82px;border:1.5px solid #9fd8b8;border-radius:14px;padding:9px;resize:vertical}.mic{width:58px;border:0;border-radius:14px;background:#065f36;color:#fff;font-size:1.35rem}.mic.listening{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(.96);opacity:.72}}.form-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow)}.field{margin-bottom:10px}.field label{display:block;margin-bottom:5px;color:#344054;font-size:.72rem;font-weight:900}.field input,.field select,.field textarea{width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:14px;padding:9px 10px;background:#fff;color:var(--ink);font-weight:750}.field textarea{min-height:85px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.profit-preview{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid #b7ebcb;background:#eefbf4;border-radius:15px;padding:9px;margin:7px 0 12px}.profit-preview small{display:block;color:#397257;font-size:.62rem;font-weight:850}.profit-preview b{display:block;color:#065f36;font-size:1.08rem}.optional{border:1px solid var(--line);border-radius:14px;margin:8px 0 12px}.optional summary{padding:11px;font-weight:900;color:var(--navy);cursor:pointer}.optional .inside{padding:0 10px 10px}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:100;width:min(100%,var(--shell));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:6px 5px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -7px 24px rgba(7,18,39,.12)}.bottom button{min-height:62px;border:0;border-radius:13px;background:transparent;color:#667085;font-size:.56rem;font-weight:950;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.bottom button i{font-style:normal;font-size:1.15rem}.bottom button.active{background:#eef4ff;color:var(--navy)}.modal{position:fixed;inset:0;z-index:200;background:rgba(7,18,39,.65);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,var(--shell));max-height:94vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:14px 12px calc(18px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h3{margin:0;color:var(--navy)}.close{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:1.4rem}.search{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:13px;padding:9px;margin-bottom:8px}.notice-good{border-left:5px solid var(--green);background:#eefbf4;color:#065f36;border-radius:14px;padding:9px 10px;font-size:.74rem;font-weight:850;margin-bottom:9px}.tiny{font-size:.63rem;color:var(--muted);font-weight:700}.status-select{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:7px;font-weight:800;background:white}.row-inline{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.route-badge{background:var(--navy);color:#fff;border-radius:999px;padding:4px 8px;font-size:.62rem;font-weight:950}.today-job{border-left:5px solid var(--blue)}
@media(max-width:390px){.screen{padding:9px}.money-row{gap:4px}.money-box{padding:6px}.money-box b{font-size:.72rem}.brand img{width:68px}.grid2{grid-template-columns:1fr 1fr}.bottom button{font-size:.52rem}}

'use strict';
const STORE='mp_jobs_v1';
const OLD_STORE='mp_van_first_route_manager_uat_v1';
const SETTINGS='mp_jobs_settings_v1';
const money=n=>'£'+(Number(n)||0).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const todayISO=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const niceDate=s=>{if(!s)return 'Unallocated';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
const uid=()=> 'MP-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
function load(){try{let raw=localStorage.getItem(STORE);if(!raw){const old=localStorage.getItem(OLD_STORE);if(old){localStorage.setItem(STORE,old);raw=old}}const x=JSON.parse(raw||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
function save(x){localStorage.setItem(STORE,JSON.stringify(x))}
function normalizeReg(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^(.{4})(.+)$/,'$1 $2').trim()}
function routeKey(j){const a=(j.routeZone||j.area||'').trim().toUpperCase();if(a)return a;const p=(j.postcode||'').trim().toUpperCase();return p.split(/\s+/)[0]||'NO AREA'}
function profit(j){return (Number(j.price)||0)-(Number(j.glassCost)||0)-(Number(j.otherCost)||0)}
function margin(j){const p=Number(j.price)||0;return p?Math.round(profit(j)/p*100):0}
function outstanding(j){return Math.max((Number(j.price)||0)-(Number(j.paid)||0),0)}
function activeJobs(){return load().filter(j=>!['Complete','Cancelled'].includes(j.status))}
function groupRoutes(jobs=activeJobs().filter(j=>!j.date)){const m=new Map();jobs.forEach(j=>{const k=routeKey(j);if(!m.has(k))m.set(k,[]);m.get(k).push(j)});return [...m.entries()].map(([zone,items])=>({zone,items,revenue:items.reduce((a,j)=>a+(+j.price||0),0),profit:items.reduce((a,j)=>a+profit(j),0)})).sort((a,b)=>b.items.length-a.items.length||b.profit-a.profit)}
function setView(v){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById('view-'+v).classList.remove('hidden');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render(v);window.scrollTo({top:0,behavior:'auto'})}
function jobCard(j,extra=''){
 const action=j.status==='Complete'?'<button class="btn" data-reopen="'+esc(j.id)+'">Reopen</button>':'<button class="btn green" data-complete="'+esc(j.id)+'">Complete</button>';

}
function renderToday(){const jobs=load(),active=jobs.filter(j=>!['Complete','Cancelled'].includes(j.status)),unallocated=active.filter(j=>!j.date),today=active.filter(j=>j.date===todayISO()),routes=groupRoutes(unallocated),hot=routes.filter(r=>r.items.length>=2),out=active.reduce((a,j)=>a+outstanding(j),0),gp=jobs.filter(j=>j.status==='Complete').reduce((a,j)=>a+profit(j),0);document.getElementById('view-today').innerHTML=`<div class="hero"><h2>Today</h2><p>Only the things that matter while you're on the move.</p><div class="kpis"><div class="kpi"><small>TODAY'S FITTINGS</small><b>${today.length}</b></div><div class="kpi"><small>UNALLOCATED JOBS</small><b>${unallocated.length}</b></div><div class="kpi"><small>ROUTE OPPORTUNITIES</small><b>${hot.length}</b></div><div class="kpi"><small>MONEY OUTSTANDING</small><b>${money(out)}</b></div></div><button class="big-add" onclick="setView('add')">＋ ADD ACCEPTED JOB</button></div>${hot.length?`<div class="section-title"><h3>🔥 Bundle these jobs</h3><span class="pill hot">SAVE JOURNEYS</span></div>${hot.slice(0,3).map(routeCard).join('')}`:''}<div class="section-title"><h3>Today's route</h3><span class="pill">${niceDate(todayISO())}</span></div>${today.length?today.map(j=>jobCard(j)).join(''):'<div class="empty">No jobs assigned to today.</div>'}<div class="section-title"><h3>Waiting for a day</h3><span class="pill">${unallocated.length}</span></div>${unallocated.slice(0,4).map(j=>jobCard(j)).join('')||'<div class="empty">Nothing waiting. Nice problem to have.</div>'}`}
function routeCard(r){return `<article class="card route-card ${r.items.length>=2?'hot':''}"><div class="route-head"><div><strong>${esc(r.zone)}</strong><div class="muted">${r.items.length} job${r.items.length===1?'':'s'} waiting</div></div><span class="pill ${r.items.length>=2?'hot':''}">${r.items.length>=2?'🔥 ROUTE OPPORTUNITY':'HOLD'}</span></div><div class="money-row"><div class="money-box"><small>REVENUE</small><b>${money(r.revenue)}</b></div><div class="money-box"><small>GROSS PROFIT</small><b>${money(r.profit)}</b></div><div class="money-box"><small>JOBS</small><b>${r.items.length}</b></div></div><ul class="route-list">${r.items.map(j=>`<li>${esc(j.customer||'Customer')} · ${esc(j.reg||j.vehicle||'No reg')} · ${money(j.price)} · profit ${money(profit(j))}</li>`).join('')}</ul><div class="route-build"><input type="date" id="date-${cssSafe(r.zone)}" min="${todayISO()}"><button class="btn primary" onclick="assignRoute('${jsq(r.zone)}')">BUILD ROUTE</button></div></article>`}
function cssSafe(s){return String(s).replace(/[^a-z0-9]/gi,'_')}
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function assignRoute(zone){const el=document.getElementById('date-'+cssSafe(zone));if(!el||!el.value){alert('Pick a day first.');return}const jobs=load();jobs.forEach(j=>{if(!j.date&&routeKey(j)===zone)j.date=el.value});save(jobs);setView('routes')}
function parseCapture(raw){const s=String(raw||'').trim();const out={};const reg=s.match(/\b([A-Z]{1,3}\d{1,4}\s?[A-Z]{0,3}|[A-Z]{2}\d{2}\s?[A-Z]{3})\b/i);if(reg)out.reg=normalizeReg(reg[1]);const cost=s.match(/(?:glass\s*)?cost(?:s|ing)?\s*(?:£|pounds?)?\s*(\d+(?:\.\d+)?)/i);if(cost)out.glassCost=cost[1];const charge=s.match(/(?:charge|charging|price|customer\s*price|getting)\s*(?:£|pounds?)?\s*(\d+(?:\.\d+)?)/i);if(charge)out.price=charge[1];const name=s.match(/(?:customer|for)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/);if(name)out.customer=name[1];const area=s.match(/(?:area|in|at)\s+([A-Z][A-Za-z' -]{2,25})(?=,|\.|\s+(?:reg|registration|screen|windscreen|glass|cost|charge|price)\b|$)/i);if(area)out.area=area[1].trim();const post=s.match(/\b([A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2})\b/i);if(post)out.postcode=post[1].toUpperCase();const job=s.match(/\b(windscreen|rear\s+(?:heated\s+)?window|door\s+glass|quarter\s+glass|drop\s+glass|side\s+glass|screen|window)\b/i);if(job)out.job=job[1].replace(/\b\w/g,c=>c.toUpperCase());return out}

tElementById(id)?.addEventListener('input',p));document.getElementById('f_area').addEventListener('input',e=>{const rz=document.getElementById('f_routeZone');if(!rz.dataset.touched)rz.value=e.target.value});document.getElementById('f_routeZone').addEventListener('input',e=>e.target.dataset.touched='1');document.getElementById('f_when').addEventListener('change',e=>{document.getElementById('dateField').classList.toggle('hidden',e.target.value!=='pick');if(e.target.value==='today')document.getElementById('f_date').value=todayISO()});document.getElementById('parseBtn').onclick=()=>{const x=parseCapture(document.getElementById('captureText').value);Object.entries(x).forEach(([k,v])=>{const el=document.getElementById('f_'+k);if(el)el.value=v});if(x.area&&!document.getElementById('f_routeZone').dataset.touched)document.getElementById('f_routeZone').value=x.area;p();document.getElementById('speechNote').textContent=Object.keys(x).length?'Filled what I could — just check it and save.':'I could not reliably pick fields out. Fill the short form below.'};setupSpeech();document.getElementById('jobForm').onsubmit=e=>{e.preventDefault();const when=document.getElementById('f_when').value;const j={id:uid(),createdAt:new Date().toISOString(),customer:val('customer'),phone:val('phone'),reg:normalizeReg(val('reg')),job:val('job'),area:val('area'),postcode:val('postcode').toUpperCase(),routeZone:val('routeZone'),glassCost:num('glassCost'),price:num('price'),otherCost:num('otherCost'),paid:num('paid'),supplier:val('supplier'),status:val('status')||'Confirmed',urgency:val('urgency')||'Normal',date:when==='today'?todayISO():(when==='pick'?val('date'):''),notes:val('notes')};if(!j.customer&&!j.reg){alert('Give me at least a customer name or registration.');return}if(!j.area&&!j.postcode&&!j.routeZone){alert('Add a town, postcode or route zone so I can group the journey.');return}const x=load();x.unshift(j);save(x);setView('today')};}

window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null});
async function installApp(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(e){}deferredInstallPrompt=null}else{alert('On Android Chrome: open the browser menu and choose “Install app” or “Add to Home screen”. The install option appears once this app is hosted securely.')}}
function backupJSON(){const payload={app:'MP Jobs',version:1,exportedAt:new Date().toISOString(),jobs:load()};const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MP_Jobs_Backup_'+todayISO()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJSON(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result),jobs=Array.isArray(p)?p:p.jobs;if(!Array.isArray(jobs))throw new Error('No jobs array');if(!confirm('Replace the jobs on this phone with '+jobs.length+' jobs from the backup?'))return;save(jobs);setView('today')}catch(e){alert('That does not look like an MP Jobs backup.')}};r.readAsText(f)};i.click()}
function exportCSV(){const rows=load(),cols=['createdAt','customer','phone','reg','job','area','postcode','routeZone','glassCost','otherCost','price','paid','status','urgency','date','supplier','notes'];const csv=[cols.join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))] .join('\n');const b=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MP_Jobs.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b)setView(b.dataset.view)});document.addEventListener('click',e=>{const ed=e.target.closest('[data-edit]');if(ed)editJob(ed.dataset.edit);const co=e.target.closest('[data-complete]');if(co)completeJob(co.dataset.complete);const ro=e.target.closest('[data-reopen]');if(ro)reopenJob(ro.dataset.reopen)});document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
renderToday();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>

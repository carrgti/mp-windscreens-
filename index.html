<script>
'use strict';
const STORE='mp_jobs_v1';
const OLD_STORE='mp_van_first_route_manager_uat_v1';
const SETTINGS='mp_jobs_settings_v1';
const SUPABASE_URL='https://asrmwsllvtsfekiugvoz.supabase.co';
const SUPABASE_KEY='sb_publishable_MnOuLzmqRYvo-FlUp-rHvw_MQHUOOa4';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const DOCUMENT_SETTINGS={vatRegistered:true,vatRate:20,quoteValidDays:30};
let cloudReady=false;
let cloudSyncing=false;
// Attach authentication immediately so login still works even if a later screen render has an error.
setTimeout(()=>initCloud(),0);
setTimeout(()=>{
  document.addEventListener('click',e=>{
    const navBtn=e.target.closest('#nav button[data-view]');
    if(navBtn){e.preventDefault();setView(navBtn.dataset.view);return;}
    const go=e.target.closest('[data-go-view]');
    if(go){e.preventDefault();setView(go.dataset.goView);return;}
    const ed=e.target.closest('[data-edit]');if(ed){e.preventDefault();editJob(ed.dataset.edit);return;}
    const co=e.target.closest('[data-complete]');if(co){e.preventDefault();completeJob(co.dataset.complete);return;}
    const ro=e.target.closest('[data-reopen]');if(ro){e.preventDefault();reopenJob(ro.dataset.reopen);return;}
    const docs=e.target.closest('[data-documents]');if(docs){e.preventDefault();openDocuments(docs.dataset.documents);return;}
    const od=e.target.closest('[data-open-document]');if(od){e.preventDefault();openSavedDocument(od.dataset.openDocument);return;}
  });
  const close=document.getElementById('closeModal');if(close)close.onclick=closeModal;
  const modal=document.getElementById('modal');if(modal)modal.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
},0);

const money=n=>'£'+(Number(n)||0).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const todayISO=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const niceDate=s=>{if(!s)return 'Unallocated';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
const uid=()=> 'MP-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
function load(){try{let raw=localStorage.getItem(STORE);if(!raw){const old=localStorage.getItem(OLD_STORE);if(old){localStorage.setItem(STORE,old);raw=old}}const x=JSON.parse(raw||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}

function ev(k){return document.getElementById('e_'+k)?.value.trim()||''}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function completeJob(id){const x=load(),j=x.find(a=>a.id===id);if(!j)return;document.getElementById('modalTitle').textContent='Complete job';document.getElementById('modalBody').innerHTML=`<div class="field" style="margin-top:8px"><label style="display:flex;align-items:center;gap:10px;font-size:.95rem;cursor:pointer"><input id="completeAidan" type="checkbox" style="width:24px;height:24px;min-height:24px" ${j.goingToAidan?'checked':''}> Is this job going to Aidan?</label></div><div class="field"><label style="display:flex;align-items:center;gap:10px;font-size:.95rem;cursor:pointer"><input id="completeReview" type="checkbox" style="width:24px;height:24px;min-height:24px" ${j.googleReviewCompleted?'checked':''}> Has a Google review been completed?</label></div><button class="big-add" id="confirmComplete">COMPLETE JOB</button><button class="btn full" style="margin-top:8px" id="cancelComplete">Cancel</button>`;document.getElementById('modal').classList.remove('hidden');document.getElementById('confirmComplete').onclick=()=>{j.goingToAidan=document.getElementById('completeAidan').checked;j.googleReviewCompleted=document.getElementById('completeReview').checked;j.status='Complete';if(!j.paid)j.paid=j.price;save(x);closeModal();render(document.querySelector('#nav button.active').dataset.view)};document.getElementById('cancelComplete').onclick=closeModal}
function reopenJob(id){const x=load(),j=x.find(a=>a.id===id);if(j){j.status='Confirmed';save(x);render(document.querySelector('#nav button.active').dataset.view)}}
function loadDemo(){if(load().length&&!confirm('Add fake Selby demo jobs to your existing UAT data?'))return;const base=[['Demo A','AB12 CDE','Selby','Windscreen',64,250],['Demo B','XY21 ZZZ','Selby','Passenger door glass',52,210],['Demo C','DE65 ABC','Selby','Rear heated window',88,290],['Demo D','FG20 YCF','Darlington','Windscreen',110,260]];const x=load();base.forEach((r,i)=>x.push({id:uid(),createdAt:new Date().toISOString(),customer:r[0],phone:'',reg:r[1],job:r[3],area:r[2],postcode:r[2]==='Selby'?'YO8':'DL1',routeZone:r[2].toUpperCase(),glassCost:r[4],price:r[5],otherCost:0,paid:0,supplier:'',status:'Confirmed',urgency:'Normal',date:'',notes:'Fake UAT demo'}));save(x);setView('routes')}
function clearAll(){if(confirm('Delete every job from MP Jobs on all synced devices?')){save([]);setView('today')}}
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;if(document.querySelector('#installAppBtn'))document.querySelector('#installAppBtn').classList.remove('hidden')});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null});
async function installApp(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(e){}deferredInstallPrompt=null}else{alert('On Android Chrome: open the browser menu and choose “Install app” or “Add to Home screen”. The install option appears once this app is hosted securely.')}}
function backupJSON(){const payload={app:'MP Jobs',version:1,exportedAt:new Date().toISOString(),jobs:load()};const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MP_Jobs_Backup_'+todayISO()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJSON(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result),jobs=Array.isArray(p)?p:p.jobs;if(!Array.isArray(jobs))throw new Error('No jobs array');if(!confirm('Replace the jobs on this phone with '+jobs.length+' jobs from the backup?'))return;save(jobs);setView('today')}catch(e){alert('That does not look like an MP Jobs backup.')}};r.readAsText(f)};i.click()}
function exportCSV(){const rows=load(),cols=['createdAt','customer','phone','reg','job','area','postcode','routeZone','glassCost','otherCost','price','paid','status','urgency','date','supplier','notes'];const csv=[cols.join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))] .join('\n');const b=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MP_Jobs.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

renderToday();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}

</script>
